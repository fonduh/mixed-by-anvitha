<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixed by Anvitha</title><meta name="description" content="A box of friends’ mixtapes. Pull out a CD and open it to listen."><meta name="theme-color" content="#f6f5e9"><meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23bac3bc'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f6f5e9'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23102d22'/%3E%3C/svg%3E">
<link rel="stylesheet" href="mixtapes/mixtapes.css?v=fullscreen-1"><link rel="stylesheet" href="page.css?v=fullscreen-1">
<link rel="stylesheet" href="collection.css?v=fullscreen-1">
<script type="importmap">{"imports":{"three":"./prototypes/waves/vendor/three.module.js"}}</script></head>
<body><main>
<section class="collection" aria-labelledby="collection-title">
<h1 id="collection-title" class="sr-only">The mixtape box</h1>
<p id="collection-note" class="sr-only" role="status">Loading the CD cases…</p>
<button id="return-case" type="button" aria-label="Back to the box" title="Back to the box" hidden>←</button>
<div class="collection-stage">
<canvas id="collection-canvas" tabindex="0" aria-label="3D CD collection. Scroll or swipe to browse; arrow keys move between cases. Select a case to lift it. When holding a case, drag to rotate, scroll to zoom, and press Enter to open. Escape returns it to the box."></canvas>
<div id="case-targets" aria-label="Pick a CD case"></div>
<div id="spotify-panel" class="mixtape-player-overlay" role="region" aria-label="Spotify player" hidden></div>
</div>
<div id="case-controls" class="mixtapes" hidden>
<div class="mixtape-zoom-controls" role="group" aria-label="Case zoom">
<button id="zoom-out" type="button" aria-label="Zoom out">−</button><input id="case-zoom" type="range" min="1" max="4" step=".1" value="1" aria-label="Case magnification"><button id="zoom-in" type="button" aria-label="Zoom in">+</button><span id="zoom-status">1×</span><button id="reset-view" type="button">Reset view</button><button id="spine-view" type="button">View spine</button>
</div>
<p id="case-date" class="sr-only"></p>
<div class="mixtape-actions"><button id="play-mixtape" type="button" disabled>Play mixtape</button><button id="toggle-case" type="button" disabled>Open case</button><a id="spotify-link" target="_blank" rel="noopener noreferrer">Listen on Spotify ↗</a></div>
<details id="browse-songs" class="mixtape-track-access"><summary>Browse songs</summary><ol id="track-list"></ol></details>
</div>

<p id="load-fallback" hidden><a href="https://open.spotify.com/playlist/6VWaYZbC9La3vbG2qIywXq">Listen to Mixed by Anvitha on Spotify ↗</a></p>
</section>
<noscript><p>Enable JavaScript to open the case, or <a href="https://open.spotify.com/playlist/6VWaYZbC9La3vbG2qIywXq">listen on Spotify</a>.</p></noscript>
</main><script type="module" src="mixtapes/mixtapes.js?v=hover-1"></script></body></html>
